# Initial research configuration; validate conventions during implementation.
random_seed: 4576

sample:
  acquisition_start: "1961-01-01"
  replication_start: "1963-07-01"
  # Five earlier starts seed all six portfolios in the first reported month.
  first_cohort_start: "1963-02-01"
  replication_end: "2002-12-31"
  extension_start: "2003-01-01"
  # Resolve against the downloaded dataset; record the actual last observation.
  extension_end: latest_available

universe:
  source: CRSP
  exchanges: [NYSE, AMEX, NASDAQ]
  include_delisted: true
  membership: historical
  formation_screen: traded_common

parameters:
  formation_months: 12
  trading_months: 6
  overlapping_cohorts: 6
  portfolios: [top5, top20, 101-120, all]
  entry_standard_deviations: 2.0

extension:
  pair_selection_candidates: [distance, correlation, cointegration]
  regime_detection: to_be_selected
  neural_methods: optional
  time_scales: [day, hour, minute]
  intraday_status: requires_separate_dataset_and_design

# The executable profiles live in src/project/specification.py; CLI overrides
# are recorded in each cohort cache. This YAML is a project summary, not a second
# source of executable defaults.
replication_specification: paper
